<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The macro editor's Code view: Monaco (Assets/Monaco) in a WebView2, offline. See Views/MacroCodeView. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; worker-src 'self' blob:; img-src 'self' data:">
<title>Code view</title>
<style>
  html, body, #editor { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
  body { background: transparent; }
</style>
</head>
<body>
<div id="editor"></div>
<script src="../Monaco/vs/loader.js"></script>
<script src="editor.js"></script>
</body>
</html>
