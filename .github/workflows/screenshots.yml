# The screenshots of the user guide and of the home page (make screenshots) taken on a GitHub Windows machine, so they
# never take over a contributor's desktop. Started only by hand on a branch: make screenshots-remote (it starts this
# workflow on the current branch, waits and puts the PNGs in site/), or gh workflow run screenshots.yml --ref <branch>.
# The runner's screen (1024 x 768) is set to 1920 x 1080 first: the editors are bigger than 1024 x 768.
# It writes nothing to the repository: the screenshots are the artifact "screenshots" (paths under site/).
name: Screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Screen 1920 x 1080
        shell: powershell
        run: ./scripts/screen-resolution.ps1 -Width 1920 -Height 1080

      - name: Screenshots
        shell: powershell
        run: |
          ./scripts/dev.ps1 -Screenshots
          ./scripts/screenshots.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: |
            site/guide/img/loop-editor.png
            site/guide/img/macro-editor.png
            site/guide/img/macro-editor-code.png
            site/guide/img/remap-editor.png
            site/assets/loops.png
          if-no-files-found: error
