# Publishes a release: when a push to main changes PuppyMacro.csproj (the merge of a "Release X.Y.Z"
# pull request from `make release-pr`) and its version has no tag yet. scripts/release-check.ps1
# decides and checks it; GitHub creates the tag vX.Y.Z with the release. `make release` (or
# Actions > Release > Run workflow) only retries; an existing tag is never published again.
name: Release

on:
  push:
    branches: [main]
    paths: [PuppyMacro/PuppyMacro.csproj]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release

# Releases come only from main: on another branch every job is skipped.
jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # tags: the next version is computed from the latest one

      - id: check
        name: Version, tag and changelog
        shell: pwsh
        run: ./scripts/release-check.ps1 -NotesFile "$env:RUNNER_TEMP/notes.md"

  # A release never ships with failing end-to-end tests.
  e2e:
    needs: check
    if: needs.check.outputs.publish == 'true'
    uses: ./.github/workflows/e2e.yml

  release:
    needs: [check, e2e]
    if: needs.check.outputs.publish == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - id: check
        name: Version, tag and changelog
        shell: pwsh
        run: ./scripts/release-check.ps1 -NotesFile "$env:RUNNER_TEMP/notes.md"

      - name: Unit tests
        run: dotnet test --project tests/PuppyMacro.Tests/PuppyMacro.Tests.csproj -c Release

      # Same script as `make build`; also downloads the previous release for the delta package.
      - name: Build the distribution
        shell: pwsh
        run: >
          ./scripts/build.ps1
          -ReleaseNotes "$env:RUNNER_TEMP/notes.md"
          -PreviousReleaseRepo "${{ github.server_url }}/${{ github.repository }}"
          -Token "${{ secrets.GITHUB_TOKEN }}"

      - name: Create GitHub Release
        run: >
          ./.tools/vpk.exe upload github
          --repoUrl ${{ github.server_url }}/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --publish
          --releaseName "PuppyMacro ${{ steps.check.outputs.version }}"
          --tag v${{ steps.check.outputs.version }}
          --targetCommitish ${{ github.sha }}
          --outputDir dist

  # The website and the guide of the new version.
  site:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/site.yml
