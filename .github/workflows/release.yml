# Publishes a release: builds the distribution of the version in PuppyMacro.csproj with
# scripts/build.ps1 (the same as `make build`) and uploads it as the GitHub Release vX.Y.Z.
# Run it with `make release`, or from the Actions tab (Release > Run workflow).
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Check version, tag and changelog
        shell: pwsh
        run: |
          $version = ([xml](Get-Content PuppyMacro/PuppyMacro.csproj)).Project.PropertyGroup.Version |
              Where-Object { $_ } | Select-Object -First 1
          if (-not $version) { throw "No <Version> in PuppyMacro/PuppyMacro.csproj." }

          $existingTag = git ls-remote --tags origin "refs/tags/v$version"
          if ($LASTEXITCODE -ne 0) { throw "Could not read the tags of origin." }
          if ($existingTag) {
              throw "Tag v$version already exists. Bump <Version> in PuppyMacro/PuppyMacro.csproj."
          }

          # Release notes: the CHANGELOG.md section of this version.
          $notes = @()
          $inSection = $false
          foreach ($line in Get-Content CHANGELOG.md) {
              if ($line -match '^## ') {
                  if ($inSection) { break }
                  $inSection = $line.Trim() -eq "## $version"
                  continue
              }
              if ($inSection) { $notes += $line }
          }
          $notes = ($notes -join "`n").Trim()
          if (-not $notes) { throw "CHANGELOG.md has no '## $version' section." }

          Set-Content -Path "$env:RUNNER_TEMP/notes.md" -Value $notes -Encoding utf8
          Add-Content -Path $env:GITHUB_ENV -Value "VERSION=$version" -Encoding utf8
          Write-Host "Releasing PuppyMacro $version"

      # Same script as `make build`; also downloads the previous release for the delta package.
      - name: Build the distribution
        shell: pwsh
        run: >
          ./scripts/build.ps1
          -ReleaseNotes "$env:RUNNER_TEMP/notes.md"
          -PreviousReleaseRepo "${{ github.server_url }}/${{ github.repository }}"
          -Token "${{ secrets.GITHUB_TOKEN }}"

      - name: Create GitHub Release
        run: >
          ./.tools/vpk.exe upload github
          --repoUrl ${{ github.server_url }}/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --publish
          --releaseName "PuppyMacro ${{ env.VERSION }}"
          --tag v${{ env.VERSION }}
          --targetCommitish ${{ github.sha }}
          --outputDir dist

  # The website and the guide of the new version.
  site:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/site.yml
