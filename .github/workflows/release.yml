# Publishes a release: builds the version in PuppyMacro.csproj, packages it with Velopack
# (Setup.exe + update packages) and creates the GitHub Release vX.Y.Z.
# Run it from the Actions tab (Release > Run workflow) or with: gh workflow run release.yml
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release

env:
  VPK_VERSION: 1.2.161

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Check version, tag and changelog
        shell: pwsh
        run: |
          $version = ([xml](Get-Content PuppyMacro/PuppyMacro.csproj)).Project.PropertyGroup.Version |
              Where-Object { $_ } | Select-Object -First 1
          if (-not $version) { throw "No <Version> in PuppyMacro/PuppyMacro.csproj." }

          $existingTag = git ls-remote --tags origin "refs/tags/v$version"
          if ($LASTEXITCODE -ne 0) { throw "Could not read the tags of origin." }
          if ($existingTag) {
              throw "Tag v$version already exists. Bump <Version> in PuppyMacro/PuppyMacro.csproj."
          }

          # Release notes: the CHANGELOG.md section of this version.
          $notes = @()
          $inSection = $false
          foreach ($line in Get-Content CHANGELOG.md) {
              if ($line -match '^## ') {
                  if ($inSection) { break }
                  $inSection = $line.Trim() -eq "## $version"
                  continue
              }
              if ($inSection) { $notes += $line }
          }
          $notes = ($notes -join "`n").Trim()
          if (-not $notes) { throw "CHANGELOG.md has no '## $version' section." }

          Set-Content -Path "$env:RUNNER_TEMP/notes.md" -Value $notes -Encoding utf8
          Add-Content -Path $env:GITHUB_ENV -Value "VERSION=$version" -Encoding utf8
          Write-Host "Releasing PuppyMacro $version"

      - name: Publish
        run: dotnet publish PuppyMacro/PuppyMacro.csproj -c Release -p:PublishProfile=Folder

      - name: Install vpk
        run: dotnet tool install --global vpk --version ${{ env.VPK_VERSION }}

      # The previous release is needed to build the delta update package.
      - name: Download previous release
        run: >
          vpk download github
          --repoUrl ${{ github.server_url }}/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --outputDir Releases

      - name: Package
        run: >
          vpk pack
          --packId PuppyMacro
          --packVersion ${{ env.VERSION }}
          --packTitle PuppyMacro
          --packAuthors "Giuseppe Vincenzi"
          --packDir publish
          --mainExe PuppyMacro.exe
          --icon PuppyMacro/Assets/PuppyMacro.ico
          --framework net10.0-x64-desktop
          --releaseNotes ${{ runner.temp }}/notes.md
          --outputDir Releases

      - name: Create GitHub Release
        run: >
          vpk upload github
          --repoUrl ${{ github.server_url }}/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --publish
          --releaseName "PuppyMacro ${{ env.VERSION }}"
          --tag v${{ env.VERSION }}
          --targetCommitish ${{ github.sha }}
          --outputDir Releases
