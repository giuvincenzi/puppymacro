# End-to-end tests on a GitHub Windows machine (same as `make e2e`), so they never take over
# a contributor's desktop. Runs on every push to main, before every release (the Release
# workflow calls it) and from the Actions tab. The runner's screen is 1024x768.
name: E2E

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Screen
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::PrimaryScreen.Bounds

      - name: Development build
        run: dotnet build PuppyMacro/PuppyMacro.csproj -c Debug

      - name: End-to-end tests
        run: dotnet test --project tests/PuppyMacro.E2E/PuppyMacro.E2E.csproj
