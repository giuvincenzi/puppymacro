# End-to-end tests on a GitHub Windows machine (same as `make e2e`), so they never take over
# a contributor's desktop. Runs on every pull request (required to merge), every push to main,
# before every release (the Release workflow calls it), and on a branch with
# `gh workflow run e2e.yml --ref <branch>`. The runner's screen is 1024x768.
# Not on the push of a release commit ("Release X.Y.Z (#N)", from `make release-pr`): the Release
# workflow runs them on that commit before publishing. Called by Release, github.workflow is
# "Release" (a called workflow gets its caller's github context), so they run there.
# The job always runs, as `e2e` is a required check (a workflow skipped by `paths` would leave it
# pending and block the merge), but on pull requests and pushes to main it skips the tests when
# only `.claude/`, `site/`, `LICENSE` or Markdown files in the repository root changed. Called by
# Release or started by hand, they always run.
name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  e2e:
    if: ${{ !(github.workflow == 'E2E' && github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release ')) }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Changed files
        id: changes
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          range=""
          if [ "$WORKFLOW" = E2E ]; then
            case "$EVENT" in
              pull_request) range="HEAD^1 HEAD" ;;
              push) range="$BEFORE $GITHUB_SHA" ;;
            esac
          fi
          run=true
          if [ -n "$range" ] && files=$(git diff --name-only $range); then
            if ! grep -qvE '^(\.claude/|site/|LICENSE$|[^/]+\.md$)' <<< "$files"; then run=false; fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ "$run" = false ]; then echo "Tests skipped: only rules, site or Markdown files changed." >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/setup-dotnet@v6
        if: steps.changes.outputs.run == 'true'
        with:
          dotnet-version: 10.0.x

      - name: Screen
        if: steps.changes.outputs.run == 'true'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::PrimaryScreen.Bounds

      - name: Development build
        if: steps.changes.outputs.run == 'true'
        run: dotnet build PuppyMacro/PuppyMacro.csproj -c Debug

      - name: End-to-end tests
        if: steps.changes.outputs.run == 'true'
        run: dotnet test --project tests/PuppyMacro.E2E/PuppyMacro.E2E.csproj
