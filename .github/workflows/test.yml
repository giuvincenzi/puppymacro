# The tests: unit tests (unit_test, like `make test`) and end-to-end tests (like `make e2e`) on GitHub machines, so they
# never take over a contributor's desktop. The required checks for merging into main are unit_test and e2e_test.
# Starts on:
#   - every pull request (each push to its branch) and every push to main;
#   - workflow_dispatch: `gh workflow run test.yml --ref <branch>`, to run the tests on a branch;
#   - workflow_call: publish_release runs it before publishing (job run_tests).
# decide_which_tests_run looks once at the changed files and tells which tests can change their result (the lists and why:
# testing.md); a test job that is not needed is skipped, and a skipped job counts as passing for a required check.
# Called by publish_release or started by hand, every test runs.
# The end-to-end tests run in E2E_GROUPS groups on as many Windows machines at once (e2e_group_1, e2e_group_2, ...), every
# test in exactly one group; e2e_test checks that each test ran once and passed (testing.md, "End-to-end tests in groups").
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  E2E_GROUPS: 7   # how many machines run the end-to-end tests at once: change only this (testing.md)

jobs:
  decide_which_tests_run:
    runs-on: ubuntu-latest
    outputs:
      unit: ${{ steps.decide.outputs.unit }}
      e2e: ${{ steps.decide.outputs.e2e }}
      screenshots: ${{ steps.decide.outputs.screenshots }}
      e2e_groups: ${{ steps.groups.outputs.e2e_groups }}
    steps:
      - name: checkout_code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the changed files: the diff of the pull request or of the push

      - name: choose_tests_from_changed_files
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          # Called by publish_release, github.workflow is the caller's: every test runs there; started by hand too.
          range=()
          if [ "$WORKFLOW" = test ]; then
            case "$EVENT" in
              pull_request) range=(HEAD^1 HEAD) ;;
              push) range=("$BEFORE" "$GITHUB_SHA") ;;
            esac
          fi
          unit=true
          e2e=true
          screenshots=true
          if [ ${#range[@]} -gt 0 ] && files=$(git diff --name-only "${range[@]}"); then
            # The files each test project builds or reads (testing.md, "Which changes run the tests on GitHub").
            shared='^(PuppyMacro/|site/guide/[^/]+\.html$|site/guide/sections\.txt$|global\.json$|\.gitattributes$|\.github/workflows/test\.yml$)'
            unit=false
            e2e=false
            screenshots=false
            if grep -E "$shared|^tests/PuppyMacro\.Tests/" <<< "$files" | grep -qvx 'site/guide/_page\.html'; then unit=true; fi
            if grep -E "$shared|^tests/PuppyMacro\.E2E/|^PuppyMacro\.sln$" <<< "$files" | grep -qvx 'site/guide/_page\.html'; then e2e=true; fi
            # The app and the scripts that take the release's screenshots (create_release_pr's take_screenshots).
            if grep -qE '^(PuppyMacro/|scripts/(dev|screenshots|screen-resolution)\.ps1$|\.github/workflows/test\.yml$)' <<< "$files"; then screenshots=true; fi
            # The merge of a release pull request: publish_release runs the tests on this commit.
            if [ "$EVENT" = push ] && grep -qx 'PuppyMacro/Version.props' <<< "$files"; then unit=false; e2e=false; screenshots=false; fi
          fi
          {
            echo "unit=$unit"
            echo "e2e=$e2e"
            echo "screenshots=$screenshots"
          } >> "$GITHUB_OUTPUT"
          echo "Unit tests: $unit. End-to-end tests: $e2e. Screenshots: $screenshots (testing.md)." >> "$GITHUB_STEP_SUMMARY"

      # E2E_GROUPS (6) -> [1,2,3,4,5,6], the matrix of e2e_group: a matrix cannot read env, so the number is written once
      # at the top and turned into the list here.
      - name: list_e2e_groups
        id: groups
        run: |
          if ! [[ "$E2E_GROUPS" =~ ^[1-9][0-9]*$ ]]; then echo "::error::E2E_GROUPS must be a number from 1: '$E2E_GROUPS'."; exit 1; fi
          echo "e2e_groups=[$(seq -s, 1 "$E2E_GROUPS")]" >> "$GITHUB_OUTPUT"

  unit_test:
    needs: decide_which_tests_run
    if: needs.decide_which_tests_run.outputs.unit == 'true'
    runs-on: windows-latest
    steps:
      - name: checkout_code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # block_version_change compares with the pull request's base

      # Only a release pull request (branch release/X.Y.Z, opened by create_release_pr) changes the version: merging it
      # publishes the release (publish_release starts when Version.props changes on main). Version.props is under
      # PuppyMacro/, so a pull request that changes it always runs this job.
      - name: block_version_change
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release/')
        shell: bash
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qx 'PuppyMacro/Version.props'; then
            echo "::error file=PuppyMacro/Version.props::Only the release pull request (create_release_pr) changes the version: merging it publishes a release."
            exit 1
          fi

      - name: install_dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: run_unit_tests
        run: dotnet test --project tests/PuppyMacro.Tests/PuppyMacro.Tests.csproj -c Release

  # One copy per group (e2e_group_1 ... e2e_group_N), at the same time, each on its own machine: on one machine the tests
  # run one at a time (they share its desktop, mouse, keyboard and PuppyMacro's data folder, testing.md).
  e2e_group:
    name: e2e_group_${{ matrix.group }}
    needs: decide_which_tests_run
    if: needs.decide_which_tests_run.outputs.e2e == 'true'
    strategy:
      fail-fast: false   # a failing group does not stop the others: every broken test shows
      matrix:
        group: ${{ fromJSON(needs.decide_which_tests_run.outputs.e2e_groups) }}
    runs-on: windows-latest   # its screen is 1024 x 768 (testing.md)
    env:
      GROUP: ${{ matrix.group }}
    defaults:
      run:
        shell: bash
    steps:
      - name: checkout_code
        uses: actions/checkout@v7

      - name: install_dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # The test project builds the development build too (PuppyMacro/bin/Debug, started by AppSession).
      - name: build_dev_app
        run: dotnet build tests/PuppyMacro.E2E/PuppyMacro.E2E.csproj -c Debug

      # Every end-to-end test by its full name (PuppyMacro.E2E.Class.Method), in the same order on every machine.
      - name: list_e2e_tests
        run: |
          mkdir -p e2e_results
          dotnet test --project tests/PuppyMacro.E2E/PuppyMacro.E2E.csproj --no-build --list-tests > "$RUNNER_TEMP/list.txt"
          grep -E '^  PuppyMacro\.E2E\.' "$RUNNER_TEMP/list.txt" | tr -d '\r' | sed -E 's/^  //; s/\(.*$//' | LC_ALL=C sort -u > e2e_results/all_tests.txt
          count=$(wc -l < e2e_results/all_tests.txt)
          if [ "$count" -eq 0 ]; then echo "::error::No end-to-end tests found."; exit 1; fi
          echo "$count end-to-end tests."

      # Test n (from 1) goes to the group of n's remainder divided by E2E_GROUPS, the remainder 0 to the last group:
      # with 7 groups, group 1 takes tests 1, 8, 15, ..., group 7 takes 7, 14, 21, ...
      - name: pick_group_tests
        run: |
          awk -v g="$GROUP" -v n="$E2E_GROUPS" '{ r = NR % n; if (r == 0) r = n; if (r == g) print }' e2e_results/all_tests.txt > e2e_results/group_tests.txt
          echo "Group $GROUP of $E2E_GROUPS: $(wc -l < e2e_results/group_tests.txt) tests."
          cat e2e_results/group_tests.txt

      # The runner's own windows (its agent's console) can stay in front of PuppyMacro and take a real click: the tests
      # start from a clear desktop, as on a contributor's PC. The windows still shown (visible, not minimized) are written
      # to the log.
      - name: minimize_other_windows
        shell: pwsh
        run: |
          Add-Type -Namespace Win32 -Name Window -MemberDefinition '
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(System.IntPtr hWnd);
            [DllImport("user32.dll")] public static extern bool IsIconic(System.IntPtr hWnd);'
          (New-Object -ComObject Shell.Application).MinimizeAll()
          Start-Sleep -Seconds 2
          Get-Process | Where-Object { $_.MainWindowHandle -ne 0 -and [Win32.Window]::IsWindowVisible($_.MainWindowHandle) -and
              -not [Win32.Window]::IsIconic($_.MainWindowHandle) } |
            ForEach-Object { Write-Host "Window still shown: $($_.ProcessName): $($_.MainWindowTitle)" }

      # The runner's state before the tests (a slow or short-of-memory runner makes the tests fail), in the log and in
      # machine_state.txt of the artifact.
      - name: log_machine_state
        shell: pwsh
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          $cpu = Get-CimInstance Win32_Processor
          $state = @(
            "Time (UTC): $((Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm:ss'))"
            "Memory: $([math]::Round($os.FreePhysicalMemory / 1KB)) MB free of $([math]::Round($os.TotalVisibleMemorySize / 1KB)) MB"
            "Paging file: $([math]::Round($os.FreeSpaceInPagingFiles / 1KB)) MB free of $([math]::Round($os.SizeStoredInPagingFiles / 1KB)) MB"
            "CPU: $(($cpu | Measure-Object -Property LoadPercentage -Average).Average)% load, $(($cpu | Measure-Object -Property NumberOfLogicalProcessors -Sum).Sum) logical processors"
          )
          # Only the windows still shown (visible, not minimized), as minimize_other_windows lists them.
          Add-Type -Namespace Win32 -Name Window -MemberDefinition '
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(System.IntPtr hWnd);
            [DllImport("user32.dll")] public static extern bool IsIconic(System.IntPtr hWnd);'
          $state += Get-Process | Where-Object { $_.MainWindowHandle -ne 0 -and $_.MainWindowTitle -and
              [Win32.Window]::IsWindowVisible($_.MainWindowHandle) -and -not [Win32.Window]::IsIconic($_.MainWindowHandle) } |
            ForEach-Object { "Window still shown: $($_.ProcessName): $($_.MainWindowTitle)" }
          $state | ForEach-Object { Write-Host $_ }
          $state | Set-Content -Path e2e_results/machine_state.txt -Encoding utf8

      - name: run_group_tests
        env:
          E2E_SCREENSHOTS: ${{ runner.temp }}/e2e_screenshots   # AppSession saves the screen and the UI tree at the end of every test
        run: |
          mapfile -t tests < e2e_results/group_tests.txt
          if [ ${#tests[@]} -eq 0 ]; then echo "No tests in this group."; exit 0; fi
          dotnet test --project tests/PuppyMacro.E2E/PuppyMacro.E2E.csproj --no-build \
            --results-directory "$PWD/e2e_results" --report-xunit-ctrf --report-xunit-ctrf-filename "group_$GROUP.json" \
            --filter-method "${tests[@]}"

      # Each test's screen and UI Automation tree as it left PuppyMacro (AppSession saves them for every test): all of
      # them in tests/, the failed tests' ones also in failed_tests/.
      - name: keep_tests_details
        if: always()
        shell: pwsh
        run: |
          $saved = "$env:RUNNER_TEMP/e2e_screenshots"
          if (Test-Path $saved) {
            New-Item -ItemType Directory -Force e2e_results/tests | Out-Null
            Copy-Item "$saved/*" e2e_results/tests/
            Write-Host "Saved for every test: $((Get-ChildItem e2e_results/tests).Count) files in tests/"
          }
          $report = "e2e_results/group_$env:GROUP.json"
          if (-not (Test-Path $report)) { exit 0 }
          $failed = (Get-Content $report -Raw | ConvertFrom-Json).results.tests | Where-Object status -ne 'passed'
          foreach ($test in $failed) {
            foreach ($kind in 'png', 'uia.txt') {
              $file = "e2e_results/tests/$($test.extra.type).$($test.extra.method).$kind"
              if (Test-Path $file) {
                New-Item -ItemType Directory -Force e2e_results/failed_tests | Out-Null
                Copy-Item $file e2e_results/failed_tests/
                Write-Host "Failed test: failed_tests/$(Split-Path $file -Leaf)"
              }
            }
          }

      # README.txt: what each file of the artifact is and how it helps investigate a failed test. The one description
      # of the artifact: testing.md points here.
      - name: describe_group_result
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force e2e_results | Out-Null
          @'
          PuppyMacro end-to-end tests: one group's results
          ================================================

          This artifact holds what one group of the end-to-end tests did on one GitHub machine (a "runner").
          The test workflow (.github/workflows/test.yml) splits the end-to-end tests into E2E_GROUPS groups that run at the
          same time on different machines. This README is written by the step describe_group_result of that workflow.

          Artifact name: e2e_group_<n>_attempt_<a>
            <n>  the group's number, from 1 to E2E_GROUPS.
            <a>  the run's attempt (github.run_attempt): 1 for the first run; "Re-run failed jobs" runs the failed groups
                 again as attempt 2, 3, ..., each with an artifact of its own next to the older ones. The job e2e_test checks
                 each group's newest attempt.

          Files
          -----
          all_tests.txt
            Every end-to-end test of the project, by full name (PuppyMacro.E2E.Class.Method), one per line, sorted the same way
            on every machine (ordinal sort). Line n is test n. Every group writes the same file; e2e_test checks they are equal.

          group_tests.txt
            The tests of this group, one per line: test n of all_tests.txt belongs to the group whose number is the remainder
            of n divided by E2E_GROUPS (remainder 0: the last group). With 7 groups, group 1 has tests 1, 8, 15, ...
            An empty file: this group had no tests (more groups than tests).

          group_<n>.json
            The test report of this group (CTRF format, JSON), written by dotnet test. Under results.tests, one entry per test
            that ran: name, status (passed, failed, skipped, ...), duration in milliseconds, and extra.type + extra.method (the
            full name, as in all_tests.txt). Missing: the tests did not run (for example the build failed).

          machine_state.txt
            The machine ONCE, BEFORE this group's tests started (after the other windows were minimized). One line each:
              Time (UTC):           when it was written.
              Memory:               free and total physical memory, in MB.
              Paging file:          free and total paging file, in MB.
              CPU:                  average load in percent at that moment, and the number of logical processors.
              Window still shown:   one line per window that is still visible and not minimized (process: title). Normally
                                    none. A window listed here can cover PuppyMacro or take a real mouse click.
            The machine's state at the end of each test is at the top of that test's .uia.txt (below).

          tests/
            For EVERY test of this group, passed or failed, saved at the end of the test, just before PuppyMacro closed:
              <Class>.<Method>.png
                The whole screen (1024 x 768).
              <Class>.<Method>.uia.txt
                First lines, the state at that moment:
                  Time (UTC):        when it was saved.
                  Machine memory:    percent in use, free and total physical memory, free and total paging file, in MB.
                  Target window:     how the test's own window (TargetWindow, the one playback tests send input to) opened:
                                     "opened in <ms> ms", or "did NOT open in <ms> ms", whether it was the first one in this
                                     test process, how long preparing Windows Forms took before the tests (WindowsFormsReady),
                                     and each step reached with its time (thread started, form created, handle created,
                                     shown); "not opened in this test".
                  PuppyMacro (process <id>):  "responding" or "NOT RESPONDING" (its UI thread did not handle window messages:
                                     it hung), the memory it used, its threads, and its CPU time since it started.
                Then an empty line and what UI Automation saw of every PuppyMacro window, one element per line, indented by two
                spaces per level:
                  <ControlType> "<Name>" [<AutomationId>]          (and "offscreen" when it is not on the screen)
                "(not readable: ...)": that element disappeared while it was read. "(cut at 5000 lines)": the tree was longer.
            A test that failed before starting PuppyMacro has no files.

          failed_tests/
            The same two files, only for the tests that failed (a copy of theirs from tests/), so they are found at once.
            Missing: no test of this group failed.

          Investigating a failed test
          ---------------------------
          Start from the test itself: its code (tests/PuppyMacro.E2E/<Class>.cs), what it does and what it expects, and the
          line that failed (in the job's log, step run_group_tests, or in e2e_test's summary). The files of this artifact can
          then help understand why that line failed; use the ones that fit the case:
            - failed_tests/<Class>.<Method>.png: what was on the screen, for example a window of the runner in front, a dialog
              still open, content that is on the screen although the test did not find it.
            - failed_tests/<Class>.<Method>.uia.txt: whether the element the test looked for existed, with which name, whether
              it was offscreen, whether a window had no children (read too early); whether PuppyMacro was responding; how much
              memory was free; how long the target window took to open, or which step it did not reach.
            - The same test when it passed (tests/ of a green run: another attempt of this run, or a recent run on main): the
              difference between its .uia.txt and the failed one can show what changed.
            - machine_state.txt: whether the machine was short of memory or had a window in front before the tests.
          These are aids, not steps to follow in order. Fix the cause, not the timeout.
          '@ | Set-Content -Path e2e_results/README.txt -Encoding utf8

      # Also when tests failed: e2e_test needs every group's lists and report. The name has the run's attempt: after a
      # "Re-run failed jobs" the group's new artifact does not mix with the failed one (e2e_test reads the newest).
      - name: save_group_result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e_group_${{ matrix.group }}_attempt_${{ github.run_attempt }}
          path: e2e_results/
          retention-days: 7

  # The release's screenshots taken as create_release_pr takes them (same scripts, same 1920 x 1080 screen), so a change
  # that breaks them fails here and not when a release is prepared. They are only saved as an artifact, never committed.
  screenshots_test:
    needs: decide_which_tests_run
    if: needs.decide_which_tests_run.outputs.screenshots == 'true'
    runs-on: windows-latest
    steps:
      - name: checkout_code
        uses: actions/checkout@v7

      - name: install_dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: set_screen_to_1920x1080
        shell: powershell
        run: ./scripts/screen-resolution.ps1 -Width 1920 -Height 1080

      - name: take_screenshots
        shell: powershell
        run: |
          ./scripts/dev.ps1 -Screenshots
          ./scripts/screenshots.ps1

      - name: save_screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots_attempt_${{ github.run_attempt }}
          path: |
            site/guide/img/*.png
            site/assets/loops.png
          retention-days: 7

  # The required check: green only when every end-to-end test ran exactly once and passed, or when none was needed, and
  # the screenshots were taken (screenshots_test) when needed.
  e2e_test:
    needs: [decide_which_tests_run, e2e_group, screenshots_test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: check_screenshots
        env:
          SCREENSHOTS: ${{ needs.screenshots_test.result }}
        run: |
          if [ "$SCREENSHOTS" != success ] && [ "$SCREENSHOTS" != skipped ]; then
            echo "::error::screenshots_test: $SCREENSHOTS (scripts/screenshots.ps1, as create_release_pr runs it)."; exit 1
          fi
          echo "Screenshots: $SCREENSHOTS." >> "$GITHUB_STEP_SUMMARY"

      - name: skip_if_not_needed
        id: needed
        env:
          DECIDE: ${{ needs.decide_which_tests_run.result }}
          E2E: ${{ needs.decide_which_tests_run.outputs.e2e }}
        run: |
          if [ "$DECIDE" != success ]; then echo "::error::decide_which_tests_run did not finish."; exit 1; fi
          if [ "$E2E" != true ]; then echo "End-to-end tests not needed: no changed file can change their result." | tee -a "$GITHUB_STEP_SUMMARY"; fi
          echo "run=$E2E" >> "$GITHUB_OUTPUT"

      - name: collect_group_results
        if: steps.needed.outputs.run == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: e2e_group_*
          path: e2e_results   # one folder per artifact: e2e_group_<n>_attempt_<a>

      # For each group its newest attempt (a re-run group has a newer one, a passed group keeps its first), then:
      # (1) every group saw the same list, (2) every test ran exactly once (none missing, none twice), (3) every test
      # and every group passed.
      - name: check_every_test_ran_once
        if: steps.needed.outputs.run == 'true'
        env:
          GROUPS_RESULT: ${{ needs.e2e_group.result }}
        shell: python3 {0}
        run: |
          import json, os, pathlib, sys
          groups = int(os.environ["E2E_GROUPS"])
          root = pathlib.Path("e2e_results")
          problems, ran, failed, lists = [], {}, [], set()
          for g in range(1, groups + 1):
              attempts = sorted(root.glob(f"e2e_group_{g}_attempt_*"), key=lambda p: int(p.name.rsplit("_", 1)[1]))
              folder = attempts[-1] if attempts else root / f"e2e_group_{g}_attempt_none"
              if attempts:
                  print(f"e2e_group_{g}: {folder.name}")
              if not (folder / "all_tests.txt").exists():
                  problems.append(f"e2e_group_{g}: no results (it did not get as far as listing the tests).")
                  continue
              lists.add((folder / "all_tests.txt").read_text())
              mine = [t for t in (folder / "group_tests.txt").read_text().split("\n") if t]
              report = folder / f"group_{g}.json"
              if mine and not report.exists():
                  problems.append(f"e2e_group_{g}: no test report (the tests did not run).")
                  continue
              executed = set()
              for test in (json.loads(report.read_text())["results"]["tests"] if mine else []):
                  name = test["extra"]["type"] + "." + test["extra"]["method"]
                  executed.add(name)
                  if test["status"] != "passed":
                      failed.append(f"{name} ({test['status']}, e2e_group_{g})")
              for name in executed:
                  ran.setdefault(name, []).append(g)
              for name in set(mine) - executed:
                  problems.append(f"{name}: in e2e_group_{g}, but it did not run.")
          if len(lists) > 1:
              problems.append("The groups did not see the same list of tests.")
          everything = [t for t in (lists.pop() if len(lists) == 1 else "").split("\n") if t]
          for name in everything:
              if name not in ran:
                  problems.append(f"{name}: ran in no group.")
          for name, where in ran.items():
              if len(where) > 1:
                  problems.append(f"{name}: ran in more than one group ({', '.join(f'e2e_group_{g}' for g in where)}).")
          if os.environ["GROUPS_RESULT"] != "success":
              problems.append(f"The groups' result is '{os.environ['GROUPS_RESULT']}'.")
          summary = [f"End-to-end tests: {len(everything)} in {groups} groups, {len(ran)} ran, {len(failed)} failed."]
          summary += [f"- Failed: {f}" for f in failed] + [f"- {p}" for p in problems]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("\n".join(summary) + "\n")
          print("\n".join(summary))
          if failed or problems:
              sys.exit(1)
