# Unit tests on every push and pull request (same command as `make test`). Not on the push of a
# release commit ("Release X.Y.Z (#N)", from `make release-pr`): the Release workflow runs them on
# that commit before publishing.
# The job always runs, as `test` is a required check (a workflow skipped by `paths` would leave it
# pending and block the merge), but it skips the tests when only `.claude/`, `site/`, `LICENSE` or
# Markdown files in the repository root changed.
name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: ${{ !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release ')) }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Changed files
        id: changes
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) range="HEAD^1 HEAD" ;;
            push) range="$BEFORE $GITHUB_SHA" ;;
            *) range="" ;;
          esac
          run=true
          if [ -n "$range" ] && files=$(git diff --name-only $range); then
            if ! grep -qvE '^(\.claude/|site/|LICENSE$|[^/]+\.md$)' <<< "$files"; then run=false; fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ "$run" = false ]; then echo "Tests skipped: only rules, site or Markdown files changed." >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/setup-dotnet@v6
        if: steps.changes.outputs.run == 'true'
        with:
          dotnet-version: 10.0.x

      - name: Unit tests
        if: steps.changes.outputs.run == 'true'
        run: dotnet test --project tests/PuppyMacro.Tests/PuppyMacro.Tests.csproj -c Release
