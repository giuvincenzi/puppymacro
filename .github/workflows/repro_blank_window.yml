# Investigation only, never merged: runs the repro tests on GitHub Windows machines at each push to this branch, one test
# per machine.
name: repro_blank_window

on:
  push:
    branches: [repro-blank-window]

permissions:
  contents: read

jobs:
  repro:
    name: repro_${{ matrix.test }}_anim_${{ matrix.anim }}
    strategy:
      fail-fast: false
      matrix:
        test:
          - Open_then_overlay_after_a_short_delay
          - Overlay_toggled_quickly_with_open_in_between
          - Toggled_over_a_fullscreen_window_then_leaving_it
        # Windows' animation effects (Settings > Accessibility > Visual effects): on as on the user's PC, off to compare
        anim: ['on', 'off']
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: checkout_code
        uses: actions/checkout@v7

      - name: install_dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: set_animation_effects
        shell: pwsh
        run: |
          Add-Type -Namespace Win32 -Name Spi -MemberDefinition '
            [DllImport("user32.dll")] public static extern bool SystemParametersInfo(uint a, uint p, System.IntPtr v, uint w);
            [DllImport("user32.dll")] public static extern bool SystemParametersInfo(uint a, uint p, ref int v, uint w);'
          $on = '${{ matrix.anim }}' -eq 'on'
          # SPI_SETCLIENTAREAANIMATION (0x1043): pvParam is the BOOL itself; SPIF_UPDATEINIFILE | SPIF_SENDCHANGE
          [void][Win32.Spi]::SystemParametersInfo(0x1043, 0, [System.IntPtr]([int]$on), 3)
          $v = 0; [void][Win32.Spi]::SystemParametersInfo(0x1042, 0, [ref]$v, 0)
          Write-Host "Animation effects now: $v"
          Get-CimInstance Win32_OperatingSystem | ForEach-Object { Write-Host "OS: $($_.Caption) $($_.Version)" }

      - name: build_dev_app
        run: dotnet build tests/PuppyMacro.E2E/PuppyMacro.E2E.csproj -c Debug

      - name: minimize_other_windows
        shell: pwsh
        run: |
          (New-Object -ComObject Shell.Application).MinimizeAll()
          Start-Sleep -Seconds 2

      - name: run_repro
        timeout-minutes: 20
        env:
          E2E_SCREENSHOTS: ${{ runner.temp }}/e2e_screenshots
        run: |
          mkdir -p "$E2E_SCREENSHOTS"
          touch "$E2E_SCREENSHOTS/repro.log"
          tail -F "$E2E_SCREENSHOTS/repro.log" &
          dotnet test --project tests/PuppyMacro.E2E/PuppyMacro.E2E.csproj --no-build \
            --filter-method "PuppyMacro.E2E.GhostFrameRepro.${{ matrix.test }}" --output Detailed

      - name: save_screenshots
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@v7
        with:
          name: repro_${{ matrix.test }}_anim_${{ matrix.anim }}_attempt_${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e_screenshots
