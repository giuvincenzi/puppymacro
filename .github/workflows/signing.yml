# Checks code signing before it reaches a release: builds and signs the distribution as the
# Release workflow does (scripts/build.ps1 -RequireSigning, every file's signature checked) and
# keeps the signed Setup as an artifact to try. Runs on pull requests that change how releases
# are built or signed, and by hand (Actions > Signing > Run workflow).
name: Signing

on:
  pull_request:
    paths:
      - scripts/build.ps1
      - .github/workflows/signing.yml
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign:
    # The secrets never reach pull requests from forks.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    environment: signing   # CERTUM_EMAIL and CERTUM_OTP (build-and-release.md)
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build and sign the distribution
        shell: pwsh
        env:
          CERTUM_EMAIL: ${{ secrets.CERTUM_EMAIL }}
          CERTUM_OTP: ${{ secrets.CERTUM_OTP }}
        run: ./scripts/build.ps1 -RequireSigning

      - uses: actions/upload-artifact@v7
        with:
          name: PuppyMacro-win-Setup-signed
          path: dist/PuppyMacro-win-Setup.exe
          retention-days: 7
