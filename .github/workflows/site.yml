# Publishes the website to GitHub Pages: the home page and one user guide per released version
# (scripts/site.ps1). The Release workflow runs it after each release; it can also be run from
# the Actions tab (Site > Run workflow) to publish the site again.
name: Site

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  site:
    # The site is published only from main (also when the Release workflow calls it).
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # all tags: every released guide version is built from its tag

      - name: Build the site
        shell: pwsh
        run: ./scripts/site.ps1

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v5
